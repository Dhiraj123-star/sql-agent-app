services:
  # --- TRAEFIK (Entry 1: http://localhost) ---
  traefik:
    image: traefik:v3.0
    container_name: traefik
    environment:
      - DOCKER_API_VERSION=1.41 
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8081:8080" # Dashboard
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - web

  # --- CADDY (Entry 2: http://localhost:8082) ---
  caddy:
    image: caddy:2.7
    container_name: caddy
    restart: always
    ports:
      - "8082:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web

  # --- OUR APPLICATION (Handled by both) ---
  sql-agent:
    build: .
    container_name: sql-agent-app
    expose:
      - "8000"
    env_file:
      - .env
    volumes:
      - ./data:/data
    restart: always
    networks:
      - web
    labels:
      # Labels allow Traefik to find this service automatically
      - "traefik.enable=true"
      - "traefik.http.routers.sql-agent.rule=Host(`localhost`)"
      - "traefik.http.routers.sql-agent.entrypoints=web"
      - "traefik.http.services.sql-agent.loadbalancer.server.port=8000"

networks:
  web:
    driver: bridge

volumes:
  sqlite_data:
  caddy_data:
  caddy_config: